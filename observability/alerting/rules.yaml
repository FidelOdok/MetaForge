groups:
  - name: metaforge_critical
    rules:
      - alert: GatewayDown
        expr: up{job="metaforge-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MetaForge Gateway is down"
          description: "Gateway has been unreachable for more than 1 minute."
          runbook_url: "https://docs.metaforge.dev/runbooks/gateway-down"

      - alert: KafkaConsumerStopped
        expr: rate(metaforge_kafka_messages_consumed_total[5m]) == 0 and metaforge_kafka_consumer_lag > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Kafka consumer {{ $labels.consumer_group }} has stopped"
          description: "Consumer group {{ $labels.consumer_group }} has zero consumption rate but non-zero lag."

      - alert: Neo4jUnreachable
        expr: metaforge_neo4j_active_connections == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Neo4j is unreachable"
          description: "No active Neo4j connections for more than 1 minute."

  - name: metaforge_warning
    rules:
      - alert: HighAgentFailureRate
        expr: rate(metaforge_agent_execution_total{status="error"}[10m]) / rate(metaforge_agent_execution_total[10m]) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High agent failure rate for {{ $labels.agent_code }}"
          description: "Agent {{ $labels.agent_code }} has >10% failure rate over 10 minutes."

      - alert: KafkaConsumerLagHigh
        expr: metaforge_kafka_consumer_lag > 5000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.consumer_group }} topic {{ $labels.topic }} has lag > 5000."

      - alert: ErrorBudgetBurnRate
        expr: |
          (
            1 - (
              sum(rate(metaforge_gateway_request_total{status_code!~"5.."}[1h]))
              /
              sum(rate(metaforge_gateway_request_total[1h]))
            )
          ) * 720 > 14.4
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Error budget burn rate is too high"
          description: "Gateway error budget is being consumed at 14.4x the sustainable rate."

      - alert: LLMCostSpike
        expr: sum(rate(metaforge_agent_llm_cost_usd_total[1h])) * 3600 > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "LLM cost spike detected"
          description: "Projected hourly LLM cost exceeds $10."

      - alert: OscillationDetected
        expr: rate(metaforge_oscillation_detected_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Design oscillation detected"
          description: "Agent feedback loop detected for {{ $labels.node_type }}."

      - alert: HarnessTurnAbnormalStopRateHigh
        expr: |
          sum(rate(metaforge_harness_turn_total{stop_reason=~"max_steps|timeout|error"}[15m]))
          /
          sum(rate(metaforge_harness_turn_total[15m])) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Chat harness turns are failing to converge"
          description: ">20% of chat-harness turns over 15m ended via max_steps/timeout/error instead of a real answer (production-harness audit follow-up)."

      - alert: HarnessToolCallErrorRateHigh
        expr: |
          sum(rate(metaforge_harness_tool_call_total{status="error"}[10m])) by (tool_name)
          /
          sum(rate(metaforge_harness_tool_call_total[10m])) by (tool_name) > 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High harness tool-call failure rate for {{ $labels.tool_name }}"
          description: "Tool {{ $labels.tool_name }} has >30% error rate over 10 minutes in the chat harness loop."

      # FORGE-520: a chat reply that claims a twin commit, or quotes a node id,
      # that the turn's tool calls do not back up. The banner tells the user
      # each time; a sustained rate means a model (or prompt) is fabricating
      # writes routinely, which a reviewer trusting the reply would miss.
      - alert: ChatUngroundedClaimsSustained
        expr: sum(increase(metaforge_chat_ungrounded_claim_total[30m])) by (kind) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Chat replies keep making ungrounded {{ $labels.kind }} claims"
          description: "More than 5 chat replies in 30 minutes were flagged as ungrounded ({{ $labels.kind }}): they claimed work or quoted node ids no tool call this turn backed up. Check the model and prompt in use."

      # FORGE-532: a solved run whose 3D result field could not be built, or a
      # recorded simulation_result whose field blob never reached MinIO. Both
      # degrade silently to the numbers-only card, so the counter is the only
      # signal that contours have stopped appearing.
      - alert: SimFieldPayloadFailures
        expr: sum(increase(metaforge_sim_field_payload_total{outcome="failed"}[30m])) by (analysis_type) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CalculiX result fields failing to build ({{ $labels.analysis_type }})"
          description: "More than 3 solved {{ $labels.analysis_type }} runs in 30 minutes produced no 3D field payload. Results still record their summary numbers, but the dashboard cannot show contours for them. Check the calculix adapter logs for calculix_field_payload_failed."
      - alert: SimFieldStoreFailures
        expr: sum(increase(metaforge_sim_field_store_total{outcome="failed"}[30m])) > 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Simulation result fields are not reaching MinIO"
          description: "More than 3 simulation_result field blobs in 30 minutes failed to store. The results are recorded without a field, so the 3D viewer shows the 'field not stored' note. Check MinIO reachability from the MCP sidecar."

      # FORGE-492: the guardrail refusing a design-flow phase's tool call is
      # survivable (the model is told and picks another tool) but it should be
      # rare. A sustained rate means a tool a phase needs is classified
      # destructive, which is how every FreeCAD session tool ended up refused.
      - alert: DesignFlowToolRefusalSustained
        expr: sum(increase(metaforge_design_flow_tool_refusal_total[15m])) by (tool_name) > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Design-flow phases keep being refused {{ $labels.tool_name }}"
          description: "The guardrail refused {{ $labels.tool_name }} for the design-flow service caller more than 5 times in 15 minutes. Check its classification in mcp_core/annotations.py."

      # FORGE-468: the primary provider pair (e.g. openai-codex + a claude-*
      # model) failed on every call for weeks while the fallback answered,
      # and nothing said so. Any sustained fallback means the configured
      # primary is not the model doing the work. A by-design capability
      # decline (e.g. Codex has no event-streaming adapter) is excluded.
      - alert: HarnessProviderFallbackSustained
        expr: |
          sum(rate(metaforge_harness_provider_fallback_total{reason!="capability_unsupported"}[15m])) by (primary, fallback, role) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Harness role {{ $labels.role }} is running on fallback {{ $labels.fallback }}, not primary {{ $labels.primary }}"
          description: "For 15m, {{ $labels.role }} calls have been served by {{ $labels.fallback }} because the primary {{ $labels.primary }} failed or was rejected. The configured model is not the one producing output. Check GET /v1/harness/providers (lastFallback) and the harness_provider_fallback log event."

      # FORGE-476: a run whose accumulated LLM spend crossed the threshold
      # (METAFORGE_RUN_SPEND_ALERT_USD, default 5). Per-run cost is not a
      # metric label, so the gateway bumps this counter once per run at the
      # crossing; the run id is in the llm_run_spend_exceeded log event.
      - alert: LlmRunawaySpendPerRun
        expr: |
          sum(increase(metaforge_llm_run_spend_exceeded_total[15m])) by (role) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A run's LLM spend crossed the runaway threshold (role {{ $labels.role }})"
          description: "At least one run spent more than the per-run LLM threshold in the last 15m. Find it with the llm_run_spend_exceeded log event, then read GET /v1/runs/{id} usage for the per-phase and per-role breakdown."

      # FORGE-466: a held approval whose waiter stopped waiting must be closed,
      # or the Approvals page offers a button for a call nobody is waiting
      # for. result="failed" means the sidecar cannot reach the ledger to
      # close what it opened; trigger="deadline" means waiters are dying
      # without closing their holds, and the gateway is cleaning up after them.
      - alert: ToolApprovalHoldCloseFailing
        expr: |
          sum(increase(metaforge_tool_approval_resolution_total{result="failed"}[15m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Held tool approvals are not being closed when their waiter stops waiting"
          description: "The MCP sidecar failed to close a held approval in the gateway ledger in the last 15m. Stale entries stay on the Approvals page until the gateway deadline expires them. Check the mcp_remote_approval_resolve_failed log event and gateway reachability from the sidecar."
      # FORGE-490: a hold created in a process nobody can answer (the design-
      # flow worker's in-process store) can only time out and deny.
      - alert: ApprovalHoldWithNoApprover
        expr: |
          sum(increase(metaforge_unreachable_approval_hold_total[15m])) by (tool) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "An approval hold was created with no reachable approver (tool {{ $labels.tool }})"
          description: "A requires_approval tool call was parked in an in-process store that no dashboard or person can see, so it was always going to be denied. Find it with the approval_hold_unreachable log event; design-flow phase turns should use approval_mode=forward."
      - alert: ToolApprovalHoldsExpiringByDeadline
        expr: |
          sum(increase(metaforge_tool_approval_resolution_total{trigger="deadline"}[30m])) > 3
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Held tool approvals are being expired by the gateway deadline"
          description: "More than 3 held approvals in 30m were expired by the gateway because their waiter never closed them, which usually means the MCP sidecar is crashing or restarting mid-hold. Check the tool_approval_hold_expired log event and the sidecar's restarts."
      # FORGE-780: durable tool approvals that nobody decides. A hold that
      # expires is a write the agent asked for and a person never saw; when
      # most of them expire, people are not being told where to decide.
      - alert: ToolApprovalsMostlyExpiring
        expr: |
          sum(increase(metaforge_tool_approval_total{outcome="expired"}[6h]))
            > 0.5 * sum(increase(metaforge_tool_approval_total{outcome="held"}[6h]))
          and sum(increase(metaforge_tool_approval_total{outcome="held"}[6h])) >= 4
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Most held tool approvals expire undecided"
          description: "Over the last 6h more than half of the durable tool approvals held for a person expired before anyone approved or rejected them. Check that the Approvals page and approvals.decide are reachable, that agents relay the held result to the person, and the tool_approval_expired log event."

  - name: metaforge_fleet_alerts
    rules:
      # Device has not sent telemetry for > N minutes (configurable per device type).
      # The threshold is set per device_type label on the metric; default 5m window.
      - alert: DeviceTelemetryStopped
        expr: |
          (time() - metaforge_device_last_telemetry_timestamp) > on(device_type)
          group_left metaforge_device_type_telemetry_interval_seconds * 3
          or
          (time() - metaforge_device_last_telemetry_timestamp) > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Device {{ $labels.device_id }} telemetry stopped"
          description: >-
            Device {{ $labels.device_id }} (type: {{ $labels.device_type }}) has not sent
            telemetry for more than 3x its expected reporting interval. Last seen
            {{ $value | humanizeDuration }} ago.
          runbook_url: "observability/runbooks/device-telemetry-stopped.md"

      # Sensor value exceeds defined safe operating range (min/max thresholds).
      - alert: SensorOutOfRange
        expr: |
          metaforge_sensor_value > on(device_type, sensor_name)
          group_left metaforge_sensor_threshold_max
          or
          metaforge_sensor_value < on(device_type, sensor_name)
          group_left metaforge_sensor_threshold_min
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Sensor {{ $labels.sensor_name }} out of range on device {{ $labels.device_id }}"
          description: >-
            Sensor {{ $labels.sensor_name }} on device {{ $labels.device_id }}
            (type: {{ $labels.device_type }}) reported value {{ $value }} which is
            outside the safe operating range.
          runbook_url: "observability/runbooks/sensor-out-of-range.md"

      # Device connection lost (MQTT disconnect without graceful shutdown).
      - alert: DeviceOffline
        expr: |
          metaforge_device_connection_status == 0
          and
          metaforge_device_graceful_disconnect == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Device {{ $labels.device_id }} offline (ungraceful disconnect)"
          description: >-
            Device {{ $labels.device_id }} (type: {{ $labels.device_type }}) lost MQTT
            connection without a graceful shutdown. The device has been offline for more
            than 2 minutes.
          runbook_url: "observability/runbooks/device-offline.md"

      # Unusual number of devices reporting errors simultaneously.
      - alert: FleetAnomalyPattern
        expr: |
          count(
            rate(metaforge_device_error_total[5m]) > 0
          ) > on() (count(metaforge_device_connection_status) * 0.10)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Fleet-wide anomaly: {{ $value }} devices reporting errors simultaneously"
          description: >-
            More than 10% of the fleet ({{ $value }} devices) are reporting errors
            simultaneously over the last 5 minutes. This may indicate a systemic issue
            such as a firmware bug, infrastructure failure, or environmental event.
          runbook_url: "observability/runbooks/fleet-anomaly-pattern.md"

      # Telemetry write errors exceeding threshold — TSDB ingestion failing.
      - alert: TSDBIngestionFailing
        expr: |
          (
            sum(rate(metaforge_tsdb_write_errors_total[5m]))
            /
            clamp_min(sum(rate(metaforge_tsdb_write_requests_total[5m])), 1)
          ) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "TSDB ingestion failure rate is {{ $value | humanizePercentage }}"
          description: >-
            Telemetry write error rate to the time-series database exceeds 1% over the
            last 5 minutes. Current rate: {{ $value | humanizePercentage }}. Device
            telemetry data may be lost.
          runbook_url: "observability/runbooks/tsdb-ingestion-failing.md"

  - name: metaforge_retrieval_quality
    rules:
      # Average precision@k drops by more than 10% relative to a 24h
      # baseline. Trips on real regressions (model drift, corpus rot,
      # bad ingest) before users notice degraded answers.
      - alert: RetrievalPrecisionRegression
        expr: |
          (
            avg_over_time(
              histogram_quantile(0.5, sum by (le)(rate(metaforge_retrieval_precision_at_k_bucket[1h])))[1h:5m]
            )
            <
            0.9 *
            avg_over_time(
              histogram_quantile(0.5, sum by (le)(rate(metaforge_retrieval_precision_at_k_bucket[1h])))[24h:5m]
            )
          )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Retrieval precision@k regressed > 10% vs 24h baseline"
          description: >-
            Median precision@k dropped more than 10% relative to its 24h
            average over the last hour. Investigate the embedding model,
            corpus changes, or recent ingest jobs.
          runbook_url: "observability/runbooks/retrieval-quality-regression.md"

      # Context-truncation rate spike — agents losing fragments past the
      # token budget more often than usual.
      - alert: ContextTruncationSpike
        expr: |
          sum(rate(metaforge_context_truncated_total[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Context truncation rate above 1 drop/sec for 10m"
          description: >-
            The assembler dropped fragments past the token budget at >1/sec
            for the last 10 minutes. Either the budget is too tight for
            the corpus, or a runaway query is over-fetching.
          runbook_url: "observability/runbooks/context-truncation-spike.md"

      # MET-401 (L1-A7) — HP-RETR-08 SLO: knowledge search p95 must
      # stay under 200 ms on the 1k-doc corpus. Five-minute window and
      # 5-minute "for" duration so a single stuck query does not page
      # but a sustained latency regression does.
      # severity is "warning" (Sev 3 in the platform mapping — paged
      # via slack-warning per ``routes.yaml`` at a 1h repeat). The
      # platform routes only know critical/warning/info; "sev3" would
      # silently fall through to the default-slack receiver, defeating
      # the purpose of the SLO alert.
      - alert: KnowledgeSearchLatencySLO
        expr: |
          histogram_quantile(
            0.95,
            sum by (le)(rate(metaforge_knowledge_search_duration_seconds_bucket[5m]))
          ) > 0.2
        for: 5m
        labels:
          severity: warning
          sev: "3"
        annotations:
          summary: "Knowledge search p95 latency exceeds 200 ms SLO"
          description: >-
            p95 of ``metaforge_knowledge_search_duration_seconds`` over
            the last 5 minutes is above the 200 ms HP-RETR-08 target.
            Check the LightRAG service, pgvector index health, and the
            reranker cold-start path before acknowledging.
          runbook_url: "observability/runbooks/knowledge-search-latency-slo.md"

      # MET-439 — Twin graph hygiene. The orphan scan (MET-429) emits
      # a per-kind gauge after every find_orphans() call. Any sustained
      # non-zero value means an agent or migration left dependent nodes
      # dangling — visible as cryptic None returns from get_work_product
      # deep in agent reasoning, so paging here heads off the confusion.
      - alert: TwinOrphansDetected
        expr: metaforge_twin_orphans{kind=~".+"} > 0
        for: 5m
        labels:
          severity: warning
          sev: "3"
        annotations:
          summary: "Twin has dangling dependent nodes"
          description: >-
            {{ $labels.kind }} orphan count: {{ $value }}. Run
            ``TwinAPI.find_orphans()`` to enumerate and either rebind or
            cascade-delete via ``delete_work_product(id, cascade=True)``.
          runbook_url: "observability/runbooks/twin-orphans.md"

      # FORGE-523 - a definition write landed but its item link did not, so
      # the node shows as a fresh sibling instead of the next revision of its
      # part / constraint set / intent. The write itself succeeded (it never
      # fails over this), which is exactly why it needs an alarm.
      - alert: TwinItemRevisionLinkFailures
        expr: increase(metaforge_twin_item_revision_total{outcome="failed"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          sev: "3"
        annotations:
          summary: "Twin writes are landing without their item revision link"
          description: >-
            {{ $value }} {{ $labels.item_type }} writes in 15m were saved without
            a REVISION_OF/HEAD link (resolved_by={{ $labels.resolved_by }}). Search
            the gateway logs for item_revision_failed for the node ids.

      # FORGE-525 - a gate approval was refused because revisions the run
      # drafted on moved before the gate (another run's approval or a direct
      # write). Nothing was overwritten, which is the point, but the run is
      # parked until a reviewer retries the phase; repeated refusals mean two
      # flows keep editing the same parts.
      - alert: TwinChangeSetApprovalsRefused
        expr: increase(metaforge_twin_change_set_total{outcome="refused"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
          sev: "3"
        annotations:
          summary: "Design-flow gate approvals refused on revision conflicts"
          description: >-
            {{ $value }} gate approvals in 15m were refused with PATCH_CONFLICT: the
            run's drafts were based on revisions that have since changed. Search the
            gateway logs for run_change_set_refused for the run and items; the gate
            needs a retry so the phase redoes its work on the current revisions.

      # FORGE-529 - the item migration linked some items or revisions and
      # failed on others. Nothing is deleted and a re-plan picks up what is
      # left, but a project half-migrated shows duplicates next to items.
      - alert: TwinItemMigrationFailures
        expr: increase(metaforge_twin_item_migration_total{outcome="failed"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
          sev: "3"
        annotations:
          summary: "Item migration failed on part of a project"
          description: >-
            {{ $value }} {{ $labels.item_type }} items failed to migrate in 15m. Search
            the gateway logs for item_migration_item_failed for the item keys, then run
            the dry run again (forge twin migrate <project>) to see what is left.

      # FORGE-528 - prd writes keep carrying requirement values the constraint
      # set does not have. The write still lands (with a warning), but a
      # steady stream means agents are writing requirements into the prd
      # instead of twin.record_constraint_set, so the prd and the gates drift.
      - alert: TwinPrdStrayRequirementValues
        expr: increase(metaforge_twin_prd_requirement_value_total{outcome="stray"}[1h]) > 20
        for: 10m
        labels:
          severity: info
          sev: "4"
        annotations:
          summary: "prd writes carry requirement values missing from the constraint set"
          description: >-
            {{ $value }} requirement values in prd prose in the last hour had no
            matching requirement in the current constraint set. Search the gateway
            logs for prd_stray_requirement_values for the projects and values.

      # FORGE-530 - the baseline brief lists one line per current item, so it
      # should fit the char cap with room to spare. Baseline briefs being cut
      # means the item lines grew (or a project has far more items than
      # expected) and the agent is losing the tail of its baseline.
      - alert: ProjectBriefBaselineCapped
        expr: sum(increase(metaforge_project_brief_total{mode="baseline", capped="true"}[1h])) > 5
        for: 15m
        labels:
          severity: info
          sev: "4"
        annotations:
          summary: "Baseline project briefs are hitting the char cap"
          description: >-
            {{ $value }} baseline-mode project briefs were shortened in the last
            hour. Search the gateway logs for project_brief_composed with
            capped=true to see which project and how many items it lists.

      # FORGE-527 - a record was saved but its revision pin edge was not, or a
      # head move could not mark the records pinned to the old revision stale.
      # Either way a stale simulation or evidence record can read as current
      # and satisfy a gate it no longer should, and nothing else would say so.
      - alert: TwinRecordStalenessFailures
        expr: increase(metaforge_twin_record_staleness_total{status=~"pin_failed|propagation_failed"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
          sev: "3"
        annotations:
          summary: "Record revision pins or staleness marking are failing"
          description: >-
            {{ $value }} {{ $labels.record_type }} records in 15m hit {{ $labels.status }}.
            Search the gateway logs for record_pin_edge_failed and
            record_staleness_failed for the record and item ids.

      # FORGE-526 -- a gate approval should pin the project's current items
      # as a baseline. "empty" or "failed" means an approval went through
      # without a baseline, so the dashboard's baseline list and diff miss it.
      - alert: TwinGateBaselineMissing
        expr: increase(metaforge_twin_baseline_total{source="gate", outcome=~"empty|failed"}[30m]) > 0
        for: 5m
        labels:
          severity: warning
          sev: "3"
        annotations:
          summary: "A gate approval did not record a baseline"
          description: >-
            {{ $value }} gate approvals in 30m recorded no baseline
            (outcome={{ $labels.outcome }}). Search the gateway logs for
            item_baseline_failed or create_item_baseline.

      # MET-455 — Consolidation contradiction rate. The BACKGROUND
      # synthesis pass flags newly-synthesized insights that conflict
      # with the existing corpus. A sustained nonzero rate means the
      # memory layer is accumulating contradictory lessons faster than
      # they're being reconciled — agents will get conflicting advice.
      - alert: ConsolidationContradictionsRising
        expr: increase(metaforge_consolidation_contradictions_total[1h]) > 5
        for: 15m
        labels:
          severity: warning
          sev: "3"
        annotations:
          summary: "Consolidation is producing contradictory insights"
          description: >-
            More than 5 contradictory insights flagged in the last hour.
            Review GET /v1/memory/insights and the consolidation logs;
            reconcile or mark the conflicting insights stale.
          runbook_url: "observability/runbooks/consolidation-contradictions.md"

  # MET-476 — KB object-store operational alerts. FORGE-577: the store is
  # SeaweedFS now (MinIO's images were withdrawn), scraped on
  # object-store:9327. Its S3 gateway labels every request with bucket, type
  # (GET/PUT/LIST/...) and HTTP code. The old bucket-size alert is gone: the
  # gateway does not report stored size, and the storage server that does
  # listens on loopback only. The MinIO rules never fired either -- nothing
  # scraped MinIO.
  - name: metaforge_storage_alerts
    rules:
      - alert: ObjectStoreWriteLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(SeaweedFS_s3_request_seconds_bucket{type="PUT",bucket="metaforge-kb"}[5m])
            )
          ) > 5
        for: 10m
        labels:
          severity: warning
          sev: "3"
        annotations:
          summary: "Object store KB write p95 latency > 5s"
          description: >-
            PUT p95 latency on ``metaforge-kb`` exceeded 5s for 10 minutes.
            Check the object-store container's disk and CPU; ingest
            pipelines (MET-468) stall under sustained slow writes.

      - alert: ObjectStoreAccessErrorsRising
        # 404s are not errors here: a bucket or object existence check
        # answers 404 routinely. Refused credentials (401/403) and server
        # errors (5xx) are.
        expr: |
          sum(rate(SeaweedFS_s3_request_total{code=~"401|403|5.."}[5m])) > 0.5
        for: 15m
        labels:
          severity: warning
          sev: "3"
        annotations:
          summary: "Object store refused or failed requests > 0.5 req/s"
          description: >-
            Sustained rate of refused (401/403) or failed (5xx) S3 requests
            above 0.5 req/s for 15 minutes. A credential mismatch between
            MINIO_ACCESS_KEY/MINIO_SECRET_KEY and the services that use the
            store shows up here; check the object-store logs.

      # FORGE-594: the gateway could not set up the KB bucket (create it and
      # turn versioning on) after retrying for about five minutes.
      - alert: KBStorageInitFailed
        expr: |
          increase(metaforge_kb_storage_init_total{outcome="failed"}[1h]) > 0
        for: 0m
        labels:
          severity: warning
          sev: "3"
        annotations:
          summary: "Knowledge-base storage set-up failed at gateway start"
          description: >-
            The gateway could not create the metaforge-kb bucket or turn its
            versioning on, so datasheet history can be overwritten in place.
            Look for kb_storage_init_failed in the gateway logs, fix the
            object store or its credentials, then restart the gateway or run
            scripts/storage/provision_minio.py.

  # ── MCP surface: the plugins' front door (FORGE-379) ──────────────────
  - name: metaforge_mcp
    rules:
      - alert: McpAdapterUnreachable
        expr: rate(metaforge_mcp_adapter_probe_total{result="unreachable"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MCP adapter {{ $labels.adapter_id }} is not answering"
          description: >-
            Its tools are still registered and still listed, so a client sees
            no gap -- calls to them fail one at a time. Check the adapter
            container.

      - alert: McpErrorRateHigh
        expr: >-
          sum by (tool_id, error_class) (rate(metaforge_mcp_error_total[5m]))
          / ignoring(error_class) group_left
          sum by (tool_id) (rate(metaforge_mcp_tool_call_total[5m])) > 0.25
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.tool_id }} is failing: {{ $labels.error_class }}"
          description: >-
            More than a quarter of calls to this tool are failing this way.
            The class says where to look: adapter_unavailable is a container,
            approval_refused is a person, tool_not_found is a client calling
            something this build does not have.

      - alert: McpApprovalsTimingOut
        expr: rate(metaforge_mcp_error_total{error_class="approval_refused"}[15m]) > 0
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "MCP writes are being refused or left unanswered"
          description: >-
            Held writes are not being decided. Not a fault -- nobody is
            watching the queue, or a reviewer is saying no repeatedly.

      - alert: McpUnexpectedErrors
        expr: rate(metaforge_mcp_error_total{error_class="unexpected"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MCP is raising errors nothing has classified"
          description: >-
            An exception type outside the known taxonomy. Either a new
            failure mode, or one that should have had a class and does not.

      # FORGE-604: browser requests refused for their Origin. Either a page
      # trying to reach the server through DNS rebinding, or a legitimate
      # front end missing from METAFORGE_MCP_ALLOWED_ORIGINS.
      - alert: McpOriginRejected
        expr: increase(metaforge_mcp_origin_rejected_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "MCP refused browser requests from an origin not on its allow-list"
          description: >-
            Look for mcp_origin_rejected in the mcp-http logs, which name the
            origin. A web page you do not recognise is the DNS-rebinding case
            the check exists for. A front end of your own needs adding to
            METAFORGE_MCP_ALLOWED_ORIGINS.

      # ── Design-flow engine (FORGE-401) ───────────────────────────────
      - alert: DesignFlowEngineUnavailable
        expr: rate(metaforge_design_flow_engine_unavailable_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Design-flow runs cannot start: Temporal at {{ $labels.target }} is unreachable"
          description: >-
            Every run start is being refused. This is deliberate -- there is
            no in-process fallback, because a run that is not durable must
            not look like one that is -- so the symptom is a hard 503 rather
            than runs that quietly vanish on the next restart. Bring Temporal
            back (`docker compose up temporal`); nothing needs replaying,
            since no run was created.

      # FORGE-469: an approval gate reached with no Temporal runtime used to
      # auto-approve. It now refuses and the run fails, so any sample here
      # means a worker is running without temporalio and every human gate
      # it reaches is being refused.
      - alert: ApprovalGateNoTemporalRuntime
        expr: rate(metaforge_approval_gate_no_runtime_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Approval gates refused: no Temporal runtime (role {{ $labels.required_role }})"
          description: >-
            wait_for_approval ran in a process where temporalio is not
            importable. The gate was refused rather than approved, so the
            run failed instead of silently passing review. Install the
            Temporal SDK in that worker and check the
            approval_activity_no_runtime log event for the run and step.

      - alert: DesignFlowGatesNeverAnswered
        expr: >-
          rate(metaforge_design_flow_gate_total{outcome="timed_out"}[1h]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Design-flow gates are expiring unanswered"
          description: >-
            A gate that nobody answers ends the run rejected. Repeated
            timeouts mean the approval queue is not being watched, not that
            reviewers are refusing work -- those are counted separately as
            outcome="rejected", and confusing the two hides an unattended
            queue behind what looks like normal review.

      # FORGE-581: client-mode phases were posted and none came back. The
      # run is waiting for a connected client that is not there.
      - alert: ClientTasksUnanswered
        expr: >-
          increase(metaforge_client_task_total{event="opened"}[2h]) > 0
          and increase(metaforge_client_task_total{event="submitted"}[2h]) == 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Client-mode phase tasks are waiting with no client submitting"
          description: >-
            A client-mode run posted phase tasks in the last two hours and
            no client submitted one. Either no Claude Code or Codex session
            is connected to pick them up, or it is not calling phase.claim.
            GET /v1/client-tasks lists what is waiting.

      # FORGE-489: a gate opened and nobody was told. The run waits silently
      # until someone polls, so this is an alarm, not an info line.
      - alert: DesignFlowGateUnannounced
        expr: >-
          increase(metaforge_design_flow_gate_announce_total{outcome=~"unannounced|failed"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A design-flow gate opened without being announced"
          description: >-
            outcome="unannounced" means the design-flow worker has no gate
            announcer wired; outcome="failed" means the gateway could not be
            reached. Either way a run is waiting at a gate that no approver
            was told about. Check the design_flow_gate_unannounced and
            design_flow_gate_announce_failed log events.

      # FORGE-470: an iteration loop converged but no approval workflow was
      # configured, so its gate could not be answered. It used to approve
      # and merge silently; it now stops at BLOCKED. Automatic approvals
      # (outcome="auto_approved") are informational and do not alert.
      - alert: IterationGateNoApprovalWorkflow
        expr: >-
          rate(metaforge_iteration_gate_unattended_total{outcome="blocked"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Iteration gates blocked: no approval workflow (agent {{ $labels.agent_code }})"
          description: >-
            An IterationController converged with auto_approve off and no
            approval workflow to ask a human, so the loop ended BLOCKED and
            nothing was merged. Wire an approval workflow into that
            controller, or set auto_approve explicitly if unreviewed merges
            are intended. The iteration_gate_no_approval_workflow log event
            carries the loop id and branch.

      # ── Code staleness (FORGE-411) ───────────────────────────────────
      - alert: McpRunningStaleCode
        expr: >-
          rate(metaforge_mcp_code_version_check_total{result="stale"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The MCP sidecar is running code other than the checkout beside it"
          description: >-
            The image's baked build SHA does not match the mounted source,
            and this process does not hot-reload. It answers every request
            correctly -- for code nobody is reading. That is why this is
            alerted rather than left to a health call: the last time it
            happened the symptoms (a shorter protocol version, missing
            tools) read as a smaller deployment, four bugs were filed
            against the run and two of their findings were not real.
            Restart the sidecar, or rebuild it if dependencies moved.

      - alert: McpCodeVersionUndetectable
        expr: >-
          rate(metaforge_mcp_code_version_check_total{result="unknown"}[1h]) > 0
        for: 2h
        labels:
          severity: info
        annotations:
          summary: "Code staleness cannot be detected on this build"
          description: >-
            No METAFORGE_BUILD_SHA was baked into the image, so the staleness
            check above can never fire. Reported rather than treated as a
            pass, because a check that silently cannot run is how the
            original bug stayed invisible. Build with
            --build-arg METAFORGE_BUILD_SHA=$(git rev-parse HEAD); CI does
            this already, so this firing means the image was built by hand.

  # FORGE-713 -- host watchdog (observability/watchdog.py). The watchdog
  # restarts what it safely can; these rules cover what it reports instead.
  - name: metaforge_host
    rules:
      - alert: TwinRunningInMemory
        expr: metaforge_watchdog_twin_in_memory == 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The gateway is serving an in-memory twin"
          description: >-
            Neo4j is configured, but the gateway's twin fell back to memory:
            every persisted node is invisible and anything written now is lost
            on the next restart. The watchdog restarts the gateway after two
            checks; firing for two minutes means the restart did not help or
            was suppressed. Check that Neo4j is up, then restart the gateway.
          runbook_url: "docs/runbooks/host-watchdog.md"

      - alert: HostMemoryLow
        expr: metaforge_host_memory_available_bytes < 536870912
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host memory available is below 512 MB"
          description: >-
            {{ $value | humanize1024 }}B available. A host with no swap stops
            answering entirely when this reaches zero. The watchdog does not
            kill anything; stop a heavy job or a service you do not need.
          runbook_url: "docs/runbooks/host-watchdog.md"

      - alert: WatchdogRestartBlocked
        expr: >-
          increase(metaforge_watchdog_restarts_total{outcome=~"suppressed|failed"}[30m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "The watchdog could not restart {{ $labels.service }}"
          description: >-
            {{ $labels.service }} needed a restart ({{ $labels.reason }}) and the
            watchdog {{ $labels.outcome }} it: it is in its cooldown, has hit the
            hourly cap, or Docker refused. A container that keeps failing after
            restarts needs a person; read its logs.
          runbook_url: "docs/runbooks/host-watchdog.md"

      - alert: WatchdogSilent
        expr: absent_over_time(metaforge_watchdog_checks_total[15m])
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nothing is watching the host"
          description: >-
            No watchdog check has been recorded for 15 minutes, so unhealthy
            containers and an in-memory twin are not being caught. Check the
            watchdog service: docker compose ps watchdog.
          runbook_url: "docs/runbooks/host-watchdog.md"

  # FORGE-726 -- gate reviewer (api_gateway/runs/gate_review.py).
  - name: metaforge_gate_review
    rules:
      - alert: GateReviewerFailing
        expr: >-
          sum(increase(metaforge_gate_review_total{recommendation="none"}[1h]))
          / clamp_min(sum(increase(metaforge_gate_review_total[1h])), 1) > 0.5
          and sum(increase(metaforge_gate_review_total[1h])) >= 4
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "The gate reviewer cannot reach a view on most gates"
          description: >-
            More than half of the last hour's gate reviews came back with no
            recommendation. Gates still wait for a person, so nothing is approved
            wrongly, but advise and auto modes are not doing their job. Check the
            reviewer model setting and the design-flow worker's logs
            (gate_review_failed).

      - alert: GateReviewerDisagreesOften
        expr: >-
          sum(increase(metaforge_gate_review_agreement_total{agreed="false"}[7d]))
          / clamp_min(sum(increase(metaforge_gate_review_agreement_total[7d])), 1) > 0.3
          and sum(increase(metaforge_gate_review_agreement_total[7d])) >= 20
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "People disagree with the gate reviewer on over 30% of gates"
          description: >-
            Over the last week, people decided differently from the reviewer's
            recommendation on more than 30% of at least 20 gates. Do not move a
            project to auto_clean or auto on this evidence; look at where it disagrees.

  # FORGE-762 -- sketch reading (api_gateway/twin/sketch_reading.py).
  - name: metaforge_sketch_reading
    rules:
      - alert: SketchReadingUnavailable
        expr: >-
          sum(increase(metaforge_sketch_reading_total{outcome=~"unavailable|refused_output"}[1h]))
          / clamp_min(sum(increase(metaforge_sketch_reading_total{outcome=~"proposed|unavailable|refused_output"}[1h])), 1) > 0.5
          and sum(increase(metaforge_sketch_reading_total{outcome=~"proposed|unavailable|refused_output"}[1h])) >= 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Most uploaded sketches cannot be read"
          description: >-
            More than half of the last hour's sketch readings found no vision model
            or got a reply that did not fit the schema. Nothing wrong is recorded,
            since a failed reading stores nothing, but people cannot turn sketches
            into concept input. Check the configured provider supports images and
            the gateway logs (sketch_reading_unavailable, sketch_reading_refused_output).

  # FORGE-789 -- sketch saves from the Create stage
  # (api_gateway/twin/sketch_strokes_recorder.py).
  - name: metaforge_sketch_save
    rules:
      - alert: SketchSavesFailing
        expr: >-
          sum(increase(metaforge_sketch_save_total{outcome="failed"}[30m]))
          / clamp_min(sum(increase(metaforge_sketch_save_total[30m])), 1) > 0.2
          and sum(increase(metaforge_sketch_save_total[30m])) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sketches drawn in Create are not being saved"
          description: >-
            More than a fifth of the last half hour's sketch saves failed. The
            strokes stay in each person's browser draft, so nothing is lost yet,
            but they are not reaching the digital twin and the Engineering view
            cannot show them. Check the gateway logs (sketch_save_failed).

  # FORGE-790 -- sketch plane changes (api_gateway/twin/sketch_planes.py).
  - name: metaforge_sketch_plane
    rules:
      - alert: SketchPlaneChangesFailing
        expr: >-
          sum(increase(metaforge_sketch_plane_total{action="failed"}[30m]))
          / clamp_min(sum(increase(metaforge_sketch_plane_total{action=~"confirmed|reassigned|undone|archived|failed"}[30m])), 1) > 0.2
          and sum(increase(metaforge_sketch_plane_total{action=~"confirmed|reassigned|undone|archived|failed"}[30m])) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sketch plane changes are failing"
          description: >-
            More than a fifth of the last half hour's sketch plane changes
            (confirm, reassign, undo, archive) failed. Sketches stay drawn and
            saved, but they cannot be placed on a plane or moved, so they do not
            appear in 3D. Check the gateway logs (sketch_plane_change_failed).

  # The manufacturing context record (api_gateway/twin/manufacturing_context.py).
  - name: metaforge_manufacturing_context
    rules:
      - alert: ManufacturingContextSyncFailing
        expr: >-
          sum(increase(metaforge_manufacturing_context_write_total{outcome="failed"}[30m]))
          / clamp_min(sum(increase(metaforge_manufacturing_context_write_total{outcome=~"written|unchanged|refused|failed"}[30m])), 1) > 0.2
          and sum(increase(metaforge_manufacturing_context_write_total{outcome="failed"}[30m])) >= 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The manufacturing context is not being updated"
          description: >-
            More than a fifth of the last half hour's manufacturing context
            syncs (from a Create brief or route save, a route decision or a
            flow proposal) failed. The saves themselves stand, but concepts are
            generated against an out-of-date context, or none. Check the gateway
            logs (manufacturing_context_sync_failed,
            manufacturing_context_promote_failed).

  # FORGE-791 -- sketch compiler (api_gateway/twin/sketch_compiler_recorder.py).
  - name: metaforge_sketch_compile
    rules:
      - alert: SketchCompilerFailing
        expr: >-
          sum(increase(metaforge_sketch_compile_total{outcome="failed"}[30m]))
          / clamp_min(sum(increase(metaforge_sketch_compile_total{outcome=~"proposed|promoted|approved|failed"}[30m])), 1) > 0.2
          and sum(increase(metaforge_sketch_compile_total{outcome=~"proposed|promoted|approved|failed"}[30m])) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sketches cannot be made editable"
          description: >-
            More than a fifth of the last half hour's sketch interpretations or
            promotions failed on the gateway (refusals of accepted rules that do
            not hold are not counted). The fitted shapes stay in each person's
            browser, but they are not reaching the digital twin. Check the
            gateway logs (sketch_interpretation_failed, sketch_promotion_failed).

  # CDE slice 6 -- exact CAD, validity and STEP (api_gateway/twin/exact_cad.py).
  - name: metaforge_exact_cad
    rules:
      - alert: GeometryValidityFailureSpike
        expr: >-
          sum(increase(metaforge_geometry_validity_total{outcome=~"fail|not_evaluated"}[30m]))
          / clamp_min(sum(increase(metaforge_geometry_validity_total[30m])), 1) > 0.3
          and sum(increase(metaforge_geometry_validity_total[30m])) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Exact geometry keeps failing its validity check"
          description: >-
            More than three in ten of the last half hour's B-Rep validity checks
            failed or could not run. Items keep their last valid revision, so
            nothing is lost, but new exact geometry is not reaching validated
            and release gates stay incomplete. Check the gateway logs
            (exact_cad_not_validated, exact_cad_validity_unavailable) and that
            the CadQuery adapter image serves cadquery.validate_shape.
      - alert: StepRoundTripFailing
        expr: >-
          sum(increase(metaforge_step_round_trip_total{outcome=~"fail|not_evaluated"}[1h]))
          / clamp_min(sum(increase(metaforge_step_round_trip_total[1h])), 1) > 0.2
          and sum(increase(metaforge_step_round_trip_total[1h])) >= 3
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "STEP exports are not round-tripping"
          description: >-
            More than a fifth of the last hour's STEP exports did not re-import
            to the same volume, bounding box and solid count, or could not be
            checked. Such exports cannot back a release. Check the gateway logs
            (step_export_recorded) and the CadQuery adapter.

  # CDE slice 9 -- face-attached sketch planes (api_gateway/twin/face_attachment.py).
  - name: metaforge_face_attachment
    rules:
      - alert: FaceRemapAmbiguitySpike
        expr: >-
          sum(increase(metaforge_face_remap_total{outcome=~"ambiguous|missing|unavailable|error"}[1h]))
          / clamp_min(sum(increase(metaforge_face_remap_total[1h])), 1) > 0.5
          and sum(increase(metaforge_face_remap_total[1h])) >= 4
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Sketches keep losing the surface they sit on"
          description: >-
            More than half of the last hour's face remaps after a CAD change
            could not pick one face (ambiguous, missing or unreadable). Each
            affected sketch is held as REATTACHMENT_REQUIRED with its last valid
            place, and its exact builds are refused until a person picks a
            surface, so nothing is wrong silently, but people are being asked
            often. Check the gateway logs (sketch_plane_reattachment_required,
            face_remap_failed): a spike of "unavailable" means the CadQuery
            adapter image does not serve cadquery.describe_faces yet.

  # FORGE-793 -- cross-domain impact (twin_core/impact/cross_domain.py).
  - name: metaforge_cross_domain_impact
    rules:
      - alert: CrossDomainImpactFailing
        expr: >-
          sum(increase(metaforge_cross_domain_impact_total{event="failed"}[30m]))
          / clamp_min(sum(increase(metaforge_cross_domain_impact_total{event=~"recorded|failed"}[30m])), 1) > 0.2
          and sum(increase(metaforge_cross_domain_impact_total{event=~"recorded|failed"}[30m])) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Cross-domain impact is not being recorded"
          description: >-
            More than a fifth of the last half hour's design changes failed
            their cross-domain impact walk. The changes themselves are saved,
            but results that depend on them across an interface (a DRC run, a
            firmware build) may still read as current. Check the logs
            (cross_domain_impact_failed).

  # FORGE-794 -- AI sketch generation (api_gateway/twin/sketch_generation.py).
  - name: metaforge_sketch_generation
    rules:
      - alert: SketchGenerationFailing
        expr: >-
          sum(increase(metaforge_sketch_generation_total{outcome=~"failed|timeout|unavailable"}[30m]))
          / clamp_min(sum(increase(metaforge_sketch_generation_total{outcome=~"generated|preservation_flagged|stale|failed|timeout|unavailable"}[30m])), 1) > 0.3
          and sum(increase(metaforge_sketch_generation_total{outcome=~"generated|preservation_flagged|stale|failed|timeout|unavailable"}[30m])) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Concept sketches cannot be generated"
          description: >-
            More than three in ten of the last half hour's concept sketch
            generations failed, timed out or found no image provider. The
            accepted concept stays on the stage, but new proposals are not
            arriving. Check METAFORGE_IMAGE_PROVIDER and its key, and the
            gateway logs (sketch_generation_failed).
      - alert: SketchGenerationPreservationFlaggedOften
        expr: >-
          sum(increase(metaforge_sketch_generation_total{outcome="preservation_flagged"}[1h]))
          / clamp_min(sum(increase(metaforge_sketch_generation_total{outcome=~"generated|preservation_flagged"}[1h])), 1) > 0.5
          and sum(increase(metaforge_sketch_generation_total{outcome=~"generated|preservation_flagged"}[1h])) >= 6
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "Region edits often change what they had to keep"
          description: >-
            More than half of the last hour's sketch generations were flagged
            because the image changed areas outside the selected region or a
            locked feature. They were held for review, not accepted, but the
            provider or model may be a poor fit for region edits.

  # FORGE-734 -- run supervisor (api_gateway/runs/supervisor.py).
  - name: metaforge_run_supervisor
    rules:
      - alert: RunSupervisorFoundPlatformIssue
        expr: >-
          increase(metaforge_run_supervisor_action_total{action="stopped",reason="platform"}[1h]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "The run supervisor stopped on something only code can fix"
          description: >-
            A supervised run kept failing a gate or a capability the agent cannot
            satisfy (a check that may be wrong, a missing tool), so the supervisor
            stopped instead of spending retries. The supervision log on the run
            says which; it usually means a bug to file, not a design to redo.

  # FORGE-761 -- AI concept images (api_gateway/twin/concept_image.py).
  - name: metaforge_concept_image
    rules:
      - alert: ConceptImageGenerationUnavailable
        expr: >-
          sum(increase(metaforge_concept_image_total{outcome=~"unavailable|timeout|failed"}[1h]))
          / clamp_min(sum(increase(metaforge_concept_image_total[1h])), 1) > 0.5
          and sum(increase(metaforge_concept_image_total[1h])) >= 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Concept images cannot be generated"
          description: >-
            More than half of the last hour's concept image requests found no image
            provider configured, timed out, or got an error back. Nothing wrong is
            recorded, since a failed generation stores nothing, but concept phases
            get no illustrative images. Check METAFORGE_IMAGE_PROVIDER, the provider
            key and the gateway logs (concept_image_unavailable, concept_image_failed).

  # FORGE-778 -- AI 3D reference meshes (api_gateway/twin/concept_mesh.py).
  - name: metaforge_concept_mesh
    rules:
      - alert: ConceptMeshGenerationUnavailable
        expr: >-
          sum(increase(metaforge_concept_mesh_total{outcome=~"unavailable|timeout|failed"}[6h]))
          / clamp_min(sum(increase(metaforge_concept_mesh_total[6h])), 1) > 0.5
          and sum(increase(metaforge_concept_mesh_total[6h])) >= 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Concept reference meshes cannot be generated"
          description: >-
            More than half of the last six hours' concept mesh requests found no mesh
            provider configured, timed out, or had the Tripo task fail or refused.
            Nothing wrong is recorded, since a failed generation stores nothing, but
            concept reviews get no 3D reference model. Check METAFORGE_MESH_PROVIDER,
            TRIPO_API_KEY (and its credit), METAFORGE_MESH_TIMEOUT_S and the gateway
            logs (concept_mesh_unavailable, concept_mesh_timeout, concept_mesh_failed).

  # FORGE-783 -- slow tool calls run as polled jobs (tool_registry/jobs.py).
  - name: metaforge_tool_jobs
    rules:
      - alert: ToolJobsFailingOrInterrupted
        expr: >-
          sum by (tool) (increase(metaforge_tool_job_total{status=~"failed|interrupted"}[6h]))
          / clamp_min(sum by (tool) (increase(metaforge_tool_job_total{status="queued"}[6h])), 1)
          > 0.5
          and sum by (tool) (increase(metaforge_tool_job_total{status="queued"}[6h])) >= 3
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Jobs of {{ $labels.tool }} are failing or being interrupted"
          description: >-
            More than half of the last six hours' jobs of {{ $labels.tool }} ended
            failed or interrupted. A failed job records its error (read it with
            twin.job_status); an interrupted one was running when its process
            restarted, so the work was lost and has to be asked for again. Check the
            tool_job_state log events and whether the gateway or MCP sidecar is
            restarting.

  # FORGE-772 -- concept image checks (api_gateway/twin/image_critique.py).
  - name: metaforge_concept_image_critique
    rules:
      - alert: ConceptImageCritiqueUnchecked
        expr: >-
          sum(increase(metaforge_concept_image_critique_total{verdict="unchecked"}[6h]))
          / clamp_min(sum(increase(metaforge_concept_image_critique_total[6h])), 1) > 0.8
          and sum(increase(metaforge_concept_image_critique_total[6h])) >= 5
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "Concept images are not being checked against their assembly"
          description: >-
            Most concept image checks in the last six hours came back unchecked: no
            concept assembly was on record, no vision model answered, or its reply
            did not fit the schema. The images are still made and labelled
            illustrative, but nobody is told when one drifts from the concept. Check
            the configured provider supports images and the gateway logs
            (concept_image_critique_unavailable, concept_image_critique_refused_output).

  # FORGE-785 -- the durable operation event log and project stream
  # (api_gateway/operations/).
  - name: metaforge_operations
    rules:
      - alert: OperationEventPublishFailing
        expr: >-
          sum(increase(metaforge_operation_event_publish_failure_total{reason="error"}[15m])) >= 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Operation events are not being stored"
          description: >-
            The gateway could not write operation events to its operation log in
            the last fifteen minutes. Runs and jobs carry on, but the Create and
            Engineering progress views stop updating and a reconnecting client
            cannot replay what it missed. Check the operation_event_publish_failed
            log events and the disk behind METAFORGE_OPERATIONS_PATH.
      - alert: OperationsStalled
        expr: >-
          sum(metaforge_operation_active) > 0
          and sum(increase(metaforge_operation_event_total[30m])) == 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Operations are active but none has reported anything for an hour"
          description: >-
            Operations are open (not completed, failed or cancelled) and no
            operation event has been stored for an hour. A run or job may be stuck,
            or its process may have stopped without ending it. Read the active
            operations with GET /v1/projects/{id}/operations?active=true and check
            the run supervisor and the tool_job_state log events.
      # FORGE-788: cancel and retry relay to Temporal or the MCP sidecar.
      - alert: OperationCancelOrRetryFailing
        expr: >-
          sum(increase(metaforge_operation_scheduling_total{action=~"cancel|retry",outcome="error"}[15m])) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Cancel or retry from the activity view keeps failing"
          description: >-
            Requests to cancel or retry an operation failed because the process
            running it could not be reached, at least three times in fifteen
            minutes. A person pressing Cancel is told it failed and the work keeps
            running. Check that Temporal and the mcp-http sidecar are up, that the
            gateway's METAFORGE_MCP_URL points at the sidecar, and the
            design_flow_cancel_failed and operation_sidecar_unreachable log events.
