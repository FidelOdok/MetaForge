server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # FORGE-593: resolve upstreams per request through Docker's DNS, not once
    # at startup. A hostname nginx cannot resolve at startup stops it from
    # starting at all, so the telemetry upstreams below (which only exist with
    # the observability profile, and `alloy` not at all in the default stack)
    # used to take the whole dashboard down with them. Resolving per request
    # also follows a recreated gateway to its new address instead of caching
    # the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8000;
    set $otel http://otel-collector:4318;
    set $faro http://alloy:12347;

    # API → gateway, with the /api prefix stripped (as the Vite dev proxy
    # does). Chat replies stream as server-sent events, so nothing is
    # buffered and a long-running stream is not cut off.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /ws {
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    # GET /health lives at the gateway's bare root, unlike everything else
    # under /api/ -- needs its own proxy entry.
    location = /health {
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # OTLP trace export → OTel Collector HTTP receiver
    location /otlp/ {
        rewrite ^/otlp/(.*)$ /$1 break;
        proxy_pass $otel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Faro browser telemetry → Alloy faro.receiver
    location /faro/ {
        rewrite ^/faro/(.*)$ /$1 break;
        proxy_pass $faro;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
