name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - docs-site/**
      - README.md
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - docs-site/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR previews must not queue behind (or cancel) a production deploy, and two
  # deploys must never overlap — hence the ref in the group rather than a
  # single global `pages`.
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: [self-hosted, linux, fidel-dev]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install
        working-directory: docs-site
        run: npm ci

      # `onBrokenLinks: 'throw'` and `markdown.hooks.onBrokenMarkdownLinks:
      # 'throw'` make this the equivalent of the old `mkdocs build --strict`:
      # a broken cross-reference fails the build rather than shipping a 404.
      - name: Build site
        working-directory: docs-site
        run: npm run build

      - name: Check the published URLs still resolve
        working-directory: docs-site
        run: npm test

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site/build

  deploy:
    # Previews build on PRs; only main publishes.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, linux, fidel-dev]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
