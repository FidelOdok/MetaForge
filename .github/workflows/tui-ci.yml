name: TUI CI

on:
  push:
    branches: [main]
    paths: ["tui/**", ".github/workflows/tui-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["tui/**", ".github/workflows/tui-ci.yml"]

jobs:
  check:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  binary:
    name: Build single binary (bun)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tui/package-lock.json
      - run: npm ci
      - run: npm run bundle:bin
      # Verify the provenance stamp end-to-end — the check that makes
      # "is my CLI stale?" answerable (the trap the Python binary hit).
      - run: ./dist/forge-tui --version
      - uses: actions/upload-artifact@v4
        with:
          name: forge-tui-linux-x64
          path: tui/dist/forge-tui
          if-no-files-found: error
