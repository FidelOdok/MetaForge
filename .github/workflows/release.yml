name: release

# Build standalone `forge` CLI binaries for each platform and publish a GitHub
# Release (MET-555). Two ways in:
#
#   * Automatic — every push to `main`. The `version` job derives the next
#     version from Conventional-Commit subjects since the last tag (feat→minor,
#     fix/perf→patch, docs/chore/ci/… → no release), creates the tag, and the
#     rest of the workflow builds + publishes. No manual step.
#   * Manual — `git tag v1.2.3 && git push origin v1.2.3` still works and uses
#     that exact version.
#
# Downloadable at:
#   https://github.com/FidelOdok/MetaForge/releases/download/<tag>/forge-linux-x64

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for the bump computation
      - name: Compute next version
        id: v
        run: bash scripts/next_version.sh
      - name: Create tag (auto-release on main)
        if: github.ref == 'refs/heads/main' && steps.v.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.v.outputs.version }}" -m "${{ steps.v.outputs.version }} (auto-release)"
          git push origin "${{ steps.v.outputs.version }}"

  build:
    name: build ${{ matrix.asset }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: forge-legacy-linux-x64
          - os: macos-latest
            asset: forge-legacy-macos-arm64
          - os: windows-latest
            asset: forge-legacy-windows-x64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The forge CLI is a thin HTTP client — install only what it imports, not
      # the full package (which pulls unix-only deps like uvloop that break the
      # Windows runner).
      - name: Install build deps
        run: python -m pip install --upgrade pip httpx structlog "pyinstaller>=6.0"

      - name: Build binary
        shell: bash
        run: bash scripts/build_forge_binary.sh

      - name: Stage asset
        shell: bash
        run: |
          mkdir -p out
          if [ -f dist/forge.exe ]; then
            cp dist/forge.exe "out/${{ matrix.asset }}"
          else
            cp dist/forge "out/${{ matrix.asset }}"
          fi

      - name: Smoke-test the binary
        shell: bash
        run: ./out/${{ matrix.asset }} chat --help

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  build-tui:
    name: build ${{ matrix.asset }}
    needs: version
    if: needs.version.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: forge-linux-x64
          - os: macos-latest
            asset: forge-macos-arm64
          - os: windows-latest
            asset: forge-windows-x64.exe
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tui/package-lock.json
      - run: npm ci
      - name: Build TUI binary (stamps git provenance)
        # The auto-release tag is created in the `version` job and isn't fetched
        # here, so pass the resolved version explicitly for the stamp.
        env:
          FORGE_VERSION: ${{ needs.version.outputs.version }}
        run: npm run bundle:bin
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p ../out
          if [ -f dist/forge.exe ]; then
            cp dist/forge.exe "../out/${{ matrix.asset }}"
          else
            cp dist/forge "../out/${{ matrix.asset }}"
          fi
      - name: Smoke-test the binary
        shell: bash
        run: ../out/${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: [version, build, build-tui]
    runs-on: ubuntu-latest
    if: needs.version.outputs.should_release == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
