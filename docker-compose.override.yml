# Dev override — auto-merged by Docker Compose.
#
# Mounts local source into containers so code changes take effect
# instantly via hot-reload. No rebuild needed.
#
# MET-694: the gateway runs with --timeout-graceful-shutdown. Without it a
# reload-triggered shutdown waits forever for open connections to close, and a
# single long-lived SSE stream (chat streaming, a dashboard left open) wedges
# the whole dev gateway at "Waiting for connections to close" — /health stops
# answering and every consumer goes down with it. A reload that drops one
# in-flight stream is strictly better than one that never completes.
#
# Usage:
#   docker compose up gateway dashboard-dev   # Gateway + Vite HMR dashboard
#   docker compose up                         # Same — override is auto-applied
#
# To run WITHOUT the override (production-like):
#   docker compose -f docker-compose.yml up

services:
  gateway:
    command: >
      uvicorn api_gateway.server:app
      --host 0.0.0.0 --port 8000 --reload
      --ws websockets-sansio
      --timeout-graceful-shutdown 10
      --reload-dir /app/api_gateway
      --reload-dir /app/orchestrator
      --reload-dir /app/twin_core
      --reload-dir /app/shared
      --reload-dir /app/domain_agents
      --reload-dir /app/skill_registry
    environment:
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - ./api_gateway:/app/api_gateway
      - ./orchestrator:/app/orchestrator
      - ./twin_core:/app/twin_core
      - ./digital_twin:/app/digital_twin
      - ./shared:/app/shared
      - ./skill_registry:/app/skill_registry
      - ./mcp_core:/app/mcp_core
      - ./tool_registry:/app/tool_registry
      - ./domain_agents:/app/domain_agents
      - ./observability:/app/observability
      - ./metaforge:/app/metaforge
      - ./pyproject.toml:/app/pyproject.toml:ro
      # Read-write (MET-612): boolean-cut staging writes input STEP files here.
      - adapter-workspace:/workspace

  dashboard-dev:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - ./dashboard:/app
      - dashboard-node-modules:/app/node_modules
    environment:
      - VITE_API_URL=http://gateway:8000
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - metaforge
    restart: unless-stopped

  # ── MCP HTTP sidecar (dev) — the service is defined in docker-compose.yml
  # (FORGE-593); a checkout adds the source mounts so a code change reaches it
  # on restart (it has no reloader: see docs/troubleshooting.md).
  mcp-http:
    environment:
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - ./api_gateway:/app/api_gateway
      - ./orchestrator:/app/orchestrator
      - ./twin_core:/app/twin_core
      - ./digital_twin:/app/digital_twin
      - ./shared:/app/shared
      - ./skill_registry:/app/skill_registry
      - ./mcp_core:/app/mcp_core
      - ./tool_registry:/app/tool_registry
      - ./domain_agents:/app/domain_agents
      - ./observability:/app/observability
      - ./metaforge:/app/metaforge
      - ./pyproject.toml:/app/pyproject.toml:ro

  # ── Cloudflare named tunnel (dev) — exposes mcp-http to Claude cloud
  # Gives the MCP sidecar a stable public HTTPS hostname so the claude.ai
  # web connector and remote/cloud Claude Code can reach it — no inbound
  # ports opened on the host. (MET-482)
  #
  # Setup (one-time, in the Cloudflare Zero Trust dashboard):
  #   1. Networks → Tunnels → Create a tunnel (type: Cloudflared).
  #   2. Copy the tunnel token into .env as CLOUDFLARE_TUNNEL_TOKEN.
  #   3. Add a Public Hostname route on that tunnel:
  #        Subdomain/domain → e.g. mcp.yourdomain.com
  #        Service          → HTTP   http://mcp-http:8765
  #      (The container resolves mcp-http over the metaforge network.)
  #   4. Point Claude at https://mcp.yourdomain.com/mcp — see
  #      docs/runbooks/cloudflare-mcp-tunnel.md.
  #
  # Ingress lives in the dashboard against the token, so no local config
  # file is needed — `tunnel run` reads everything from the token.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - mcp-http
    networks:
      - metaforge
    restart: unless-stopped

  # FORGE-493: the design-flow worker runs every phase of a design flow, and
  # it was the one app service with no source mounts: a worker fix waited for
  # CI's image publish and a pull. Same mounts as temporal-worker, so a fix
  # takes effect on `docker compose restart design-flow-worker`. No auto
  # reload on purpose: a reload would kill a phase mid-turn. Temporal retries
  # the interrupted activity after a restart, so restart between phases when
  # you can.
  design-flow-worker:
    volumes:
      - ./api_gateway:/app/api_gateway
      - ./orchestrator:/app/orchestrator
      - ./twin_core:/app/twin_core
      - ./digital_twin:/app/digital_twin
      - ./shared:/app/shared
      - ./skill_registry:/app/skill_registry
      - ./mcp_core:/app/mcp_core
      - ./tool_registry:/app/tool_registry
      - ./domain_agents:/app/domain_agents
      - ./observability:/app/observability
      - ./metaforge:/app/metaforge
      - ./pyproject.toml:/app/pyproject.toml:ro

  # ── Temporal Worker: dev source mounts ──────────────────────────
  # Same pattern as gateway/mcp-http above: mount the source so a code change
  # takes effect on `docker compose restart temporal-worker` instead of
  # requiring a full image rebuild. The worker has no --reload equivalent
  # (it is not uvicorn), so a restart is the reload.
  temporal-worker:
    volumes:
      - ./api_gateway:/app/api_gateway
      - ./orchestrator:/app/orchestrator
      - ./twin_core:/app/twin_core
      - ./digital_twin:/app/digital_twin
      - ./shared:/app/shared
      - ./skill_registry:/app/skill_registry
      - ./mcp_core:/app/mcp_core
      - ./tool_registry:/app/tool_registry
      - ./domain_agents:/app/domain_agents
      - ./observability:/app/observability
      - ./pyproject.toml:/app/pyproject.toml:ro
