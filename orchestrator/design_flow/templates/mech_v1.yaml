# mech_v1 flow template (FORGE-397).
#
# Generated, not hand-edited -- regenerate via the snippet in
# tests/unit/test_flow_templates.py rather than editing the YAML by hand.
# (Hand-editing produced a broken file once already: `name` is a folded
# multi-line scalar, and an inserted key landed inside it.)
#
# `version` is recorded on every run started from this template. Bump it
# when the phases or gates change, so a completed run can still say what
# it actually ran.
id: mech_v1
version: 1.3.0
name: Mechanical vertical (Requirements -> Mechanical Design -> V&V), goal-driven
label: Mechanical design
description: A focused flow for a load-bearing part or mechanical subsystem.
phases:
- id: intent
  title: Intent
  objective: >-
    Establish WHY this product is being built, before any requirements. From the stated goal,
    identify: the system's purpose, its primary stakeholder(s), the initial operating context,
    the system boundary (what's in scope vs out of scope), and the desired outcome. Record
    ONE intent entity capturing this with the record-engineering-entity tool (entity_type='intent'),
    scoped to the project.
  expected_artifacts:
  - intent
  required_deliverables:
  - intent
  gate:
    name: Intent sign-off
    criteria:
    - System purpose stated
    - Primary stakeholder(s) identified
    - System boundary (in/out of scope) defined
    - Desired outcome stated
- id: needs
  title: Stakeholder Needs
  objective: >-
    Identify the stakeholder needs this product must satisfy, tracing back to the recorded
    intent. For each stakeholder, capture their need in plain language -- avoid premature
    implementation detail (that's what requirements are for, next phase). Record each with
    the record-engineering-entity tool (entity_type='stakeholder_need', parent_refs=[the intent's
    title], relation='motivates'), scoped to the project.
  expected_artifacts:
  - stakeholder_need
  required_deliverables:
  - stakeholder_need
  gate:
    name: Needs sign-off
    criteria:
    - Stakeholder set identified
    - Each stakeholder's need captured in plain language
    - Needs trace to the recorded intent
- id: requirements
  title: Requirements
  objective: >-
    Establish the mechanical requirements from the goal. Quantify the load case (magnitude
    and where it acts / moment arm), the material class, the safety-factor target, and the
    mass/envelope budget. Record the requirements and load case as a design decision, scoped
    to the project.
  expected_artifacts:
  - design_decision
  required_deliverables:
  - design_decision
  gate:
    name: Requirements sign-off
    criteria:
    - Load case quantified (magnitude + location)
    - Material class and safety-factor target stated
    - Mass / envelope budget stated
    - Parent traceability exists (requirements trace to a need)
- id: feasibility
  title: Preliminary Feasibility
  objective: >-
    Sanity-check feasibility before committing to detailed design. Check the requirement's
    mass, cost, and power/energy budgets against a first-order estimate; assess first-order
    structural feasibility, actuator sizing, thermal plausibility, and geometry feasibility;
    confirm the key technologies involved are actually available; and identify the major risks
    to the project, each with an owner and a mitigation. Record a feasibility summary as a
    decision (record-decision tool), scoped to the project -- flag anything infeasible or
    high-risk explicitly rather than silently proceeding.
  expected_artifacts:
  - design_decision
  required_deliverables:
  - design_decision
  gate:
    name: Preliminary Feasibility Gate (G3)
    criteria:
    - Mass budget checked
    - Cost budget checked
    - Power/energy budget checked
    - First-order structural feasibility assessed
    - Actuator sizing assessed (where applicable)
    - Thermal plausibility assessed
    - Geometry feasibility assessed
    - Key technologies confirmed available
    - Major risks identified, each with an owner and mitigation
    gate_id: G3
- id: route_selection
  title: Manufacturing Route & Process Selection
  objective: >-
    Before any detailed design, choose how the part will be made, from what is available. Read
    the manufacturing context in this brief (route, machines, stock, quantity, budget); ask the
    person for anything missing rather than assume it. Pick 2 to 4 candidate processes the route
    allows, source each one's capability limits and costs as design values with their sources,
    and rank them with the rank_manufacturing_processes skill. Record a decision
    (record-decision tool) scoped to the project with manufacturing_route (the recommended route
    'in_house' or 'vendor', process and material_class) and process_ranking (the candidates with
    their reasons); a process the person already stated is a one-candidate ranking. Record the
    chosen process's limits as a constraint set so the design is held to them. If the person
    cannot decide yet, pass manufacturing_route with deferred: true and their reason. The gate
    shows the ranking: approving accepts the recommendation; a retry naming another process
    records that one instead. A decision without manufacturing_route, or a chosen route without
    process_ranking, leaves the gate not ready.
  expected_artifacts:
  - design_decision
  - constraint_set
  required_deliverables:
  - design_decision
  disciplines:
  - manufacturing
  gate:
    name: Manufacturing route and process decision
    criteria:
    - Candidate processes compared on fit, availability and cost at quantity
    - Capability values sourced, not assumed
    - Chosen process and material recorded, with its limits as constraints
- id: industrial_design
  title: Industrial Design
  objective: >-
    Decide the product's form factor, check that people can use it, and choose finishes that
    suit how its parts are made, before mechanical design draws the housing. (1) Form factor:
    list the contents the product must hold (from the architecture and the selected concept:
    boards, batteries, actuators, bought parts), each with its size and how it is known, and run
    form_factor_envelope with the internal clearance and the wall thickness (the chosen
    process's minimum wall, from library.process_limits or library.machine_limits, when a
    process is chosen), checked against the maximum envelope the requirements state. Record the
    resulting envelope with twin.record_constraint_set, parent_refs set to the requirement it
    serves, so mechanical design works to it. (2) Ergonomics: if people hold, press, reach or
    lift the product, take the intended users from the requirements (ask the person if no
    requirement says), find a sourced limit for each human-contact feature (an anthropometric
    dataset or ergonomics guidance, cited with its table and percentile) and run
    check_ergonomics. If nobody handles it, record that, with the reason, instead. Never supply
    a body measurement from memory. (3) Colour, material and finish: the look is the person's
    choice; ask for it if it was not stated. Choose a library appearance per visible part
    (library.list_appearances; a new one is registered with library.register_appearance, held
    for the person's approval, with its colour code and a sourced screen value), and run
    check_cmf_compatibility against each part's material. Record one decision with
    twin.record_decision covering the envelope, the ergonomics verdict and the finishes, naming
    every unknown and every assumed value.
  expected_artifacts:
  - design_decision
  - constraint_set
  required_deliverables:
  - design_decision
  disciplines:
  - industrial_design
  gate:
    name: Industrial design review
    criteria:
    - Form factor envelope defined from sized contents, clearance and wall, each sourced
    - Envelope recorded as a constraint for mechanical design
    - Ergonomics checked against sourced limits for the stated users, or recorded as not applicable with the reason
    - Finishes chosen per visible part and compatible with its material, or the open items listed
    - Unknown and assumed values named
- id: design
  title: Mechanical Design
  objective: >-
    Design the part THE GOAL DESCRIBES — not a generic or example part. Author its geometry
    with the FreeCAD tools, sized to the requirements; name the part after what it actually
    is; use the process and material chosen at the route gate and design to that process's
    limits (the constraint set recorded there); then PERSIST it with the commit-geometry tool so it becomes a
    viewable cad_model (a described-but-uncommitted model does NOT count). Record the design
    rationale: the dimensions, the material, and how the section carries the load. If sizing
    this part derives a specific numeric spec (e.g. a section dimension driven by the load
    case), record it with `twin.record_constraint_set` and set `parent_refs` to the system
    requirement it implements.
  expected_artifacts:
  - cad_model
  - design_decision
  required_deliverables:
  - cad_model
  disciplines:
  - mechanical
  gate:
    name: Mechanical design review (G6)
    criteria:
    - The committed geometry is the part the goal asked for
    - Sized to the requirements; material chosen with rationale
    - Committed as a viewable cad_model
    enforce_constraints: true
    gate_id: G6
- id: dfm_review
  title: DFM Review & Manufacturing Plan
  objective: >-
    Check the committed design against the process chosen at the route gate, with the
    check_manufacturability skill: each feature (wall thickness, holes, inside corner and bend
    radii, draft, overhang, envelope) against that process's sourced limits, pass, fail or
    unknown, saying for each value whether it was measured, declared when the part was authored,
    or stated. Record failing and unknown findings as evidence against the cad_model. Write the
    manufacturing plan: stock to buy, operations in order, quantity, and a unit cost only if
    every input is sourced. Record a decision (record-decision tool) scoped to the project with
    dfm_review (process, verdict, findings, unknowns, plan). A not_manufacturable verdict leaves
    the gate not ready: rework the design. An incomplete verdict passes with what could not be
    checked named; approving accepts it.
  expected_artifacts:
  - design_decision
  required_deliverables:
  - design_decision
  disciplines:
  - manufacturing
  gate:
    name: DFM review (manufacturability)
    criteria:
    - Design checked feature by feature against the chosen process
    - Each value's basis stated (measured, declared or stated)
    - Manufacturing plan with stock and operations in order
- id: simulation
  title: Simulation & V&V
  objective: >-
    Validate the part against its safety-factor requirement. Mesh the committed geometry and
    run CalculiX FEA under the load case; extract the max stress and safety factor; record
    a pass/fail verdict against the requirement. If FEA tooling is unavailable, say so explicitly
    — do NOT present a hand-calc as FEA.
  expected_artifacts:
  - simulation_result
  - design_decision
  required_deliverables:
  - design_decision
  disciplines:
  - simulation
  gate:
    name: V&V sign-off (G7)
    criteria:
    - FEA executed on the committed geometry
    - Max stress / safety factor extracted
    - Pass/fail verdict recorded against the requirement
    enforce_constraints: true
    gate_id: G7
