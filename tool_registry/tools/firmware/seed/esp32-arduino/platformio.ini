; Seed project: built once at image build so the Arduino-ESP32 framework for the
; XIAO ESP32S3 and the libraries below are in the image, and a firmware.build
; needs no network. Not user firmware. The libraries are copied to the image's
; offline library folder (FIRMWARE_LIBRARY_DIR) after this builds.
[env:xiao_s3_arduino]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps =
  adafruit/Adafruit NeoPixel@1.15.5
  claws/BH1750@1.3.0
