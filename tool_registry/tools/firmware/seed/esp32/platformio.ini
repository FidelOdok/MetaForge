; Seed project: built once at image build so the ESP32 platform, the Xtensa
; toolchain and ESP-IDF are in the image and a firmware.build needs no
; network. Not user firmware.
[env:seed]
platform = espressif32
board = esp32dev
framework = espidf

; The XIAO ESP32S3 (ESP32-S3) with ESP-IDF, so its toolchain is in the image too.
[env:xiao_s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf
