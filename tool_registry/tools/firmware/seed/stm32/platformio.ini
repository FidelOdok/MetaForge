; Seed project: built once at image build so the STM32 platform, the
; arm-none-eabi toolchain and the STM32Cube framework of each family the
; emulator runs (F4, F7, H7) are in the image and a firmware.build needs no
; network. STM32Cube is packaged per family. Not user firmware.
[env]
platform = ststm32
framework = stm32cube

[env:f4]
board = disco_f407vg
; `pio check` on this env installs both static checkers into the image.
check_tool = cppcheck, clangtidy

[env:f7]
board = nucleo_f767zi

[env:h7]
board = nucleo_h753zi
